[project]
name = "torrent-file-priority-manager"
version = "0.1.0"
description = "Torrent file priority manager"
readme = "README.md"
authors = [
    { name = "MrMarvel", email = "24212110+MrMarvel@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "requests~=2.0",
]

[project.scripts]
torrentfileprioritymanager = "torrentfileprioritymanager:main"
torrent-file-priority-manager = "torrentfileprioritymanager:main"
torrent_file_priority_manager = "torrentfileprioritymanager:main"

[tool.uv.build-backend]
module-name = "torrentfileprioritymanager"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nuitka",
]
